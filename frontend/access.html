<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access — FrameBid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="/assets/site-gate.js"></script>
  <style>
    :root {
      --ink: #050506;
      --panel: #0c0c0e;
      --line: rgba(247, 247, 247, 0.1);
      --text: #f7f7f7;
      --mute: #8a8b94;
      --accent: #456aed;
      --danger: #ff7a6e;
      --font-display: "Outfit", "Avenir Next", sans-serif;
      --font-body: "IBM Plex Sans", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font-body);
      background:
        radial-gradient(1000px 560px at 80% -10%, rgba(69, 106, 237, 0.16), transparent 55%),
        linear-gradient(180deg, #0a0a0c 0%, var(--ink) 55%, #050506 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(400px, 100%);
      background: linear-gradient(160deg, rgba(69, 106, 237, 0.12), transparent 55%), var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 32px 32px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0;
      margin-bottom: 28px;
      color: #7a91a3;
      text-decoration: none;
    }
    .brand img { height: 36px; width: auto; display: block; }
    .brand-word {
      margin-left: -8px;
      margin-top: 2px;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 24px;
      color: var(--mute);
      font-size: 15px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mute);
    }
    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: rgba(69, 106, 237, 0.65); }
    button {
      margin-top: 14px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .error {
      display: none;
      margin-top: 14px;
      color: var(--danger);
      font-size: 13px;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand" aria-label="FrameBid">
      <img src="/assets/framebid-logo.png" alt="" width="78" height="36">
      <span class="brand-word">FRAMEBID</span>
    </div>
    <h1>Enter access code</h1>
    <p>This preview is private. Enter the site password to open the portal.</p>
    <form id="gate-form" autocomplete="current-password">
      <label for="gate-password">Password</label>
      <input id="gate-password" name="password" type="password" autofocus required>
      <button type="submit">Continue</button>
      <div id="gate-error" class="error" role="alert">Incorrect password. Try again.</div>
    </form>
  </main>
  <script>
    (function () {
      if (window.FrameBidGate && FrameBidGate.unlocked()) {
        location.replace(FrameBidGate.nextTarget());
        return;
      }
      var form = document.getElementById("gate-form");
      var input = document.getElementById("gate-password");
      var error = document.getElementById("gate-error");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!FrameBidGate.checkPassword(input.value)) {
          error.classList.add("show");
          input.select();
          return;
        }
        FrameBidGate.unlock();
        location.replace(FrameBidGate.nextTarget());
      });
    })();
  </script>
</body>
</html>
