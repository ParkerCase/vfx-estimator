<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrameBid — AI-powered VFX bidding in seconds</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #f4f6fb;
      font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: min(440px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo { height: 48px; width: auto; }
    h1 {
      font-size: clamp(32px, 5vw, 44px);
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-weight: 800;
    }
    .tag {
      color: #b7c0d4;
      font-size: clamp(16px, 2.4vw, 20px);
      font-weight: 500;
    }
    #qr {
      margin-top: 8px;
      padding: 18px;
      background: #11131a;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      line-height: 0;
    }
    #qr img, #qr canvas { display: block; }
    .scan {
      color: #8ea2ff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/framebid-logo.png" alt="FrameBid">
    <h1>FrameBid</h1>
    <p class="tag">AI-powered VFX bidding in seconds</p>
    <div id="qr" role="img" aria-label="QR code linking to FrameBid"></div>
    <p class="scan">Scan to get started</p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qr"), {
      text: "https://www.framebid.ai",
      width: 256,
      height: 256,
      colorDark: "#ffffff",
      colorLight: "#00000000"
    });
  </script>
</body>
</html>
