<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — FrameBid</title>
  <script src="/assets/site-gate.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --ink: #050506;
      --panel: #0c0c0e;
      --line: rgba(247, 247, 247, 0.1);
      --text: #f7f7f7;
      --mute: #8a8b94;
      --accent: #456aed;
      --mint: #6fd9a8;
      --danger: #ff7a6e;
      --font-display: "Outfit", "Avenir Next", sans-serif;
      --font-body: "IBM Plex Sans", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font-body);
      background:
        radial-gradient(1000px 560px at 80% -10%, rgba(69, 106, 237, 0.16), transparent 55%),
        radial-gradient(780px 420px at 10% 20%, rgba(111, 217, 168, 0.06), transparent 50%),
        linear-gradient(180deg, #0a0a0c 0%, var(--ink) 50%, #050506 100%);
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 0;
    }
    a { color: inherit; text-decoration: none; }
    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0;
      font-family: var(--font-display);
      color: #7a91a3;
      text-decoration: none;
    }
    .brand-logo {
      height: 40px;
      width: auto;
      display: block;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    .brand-word-clip {
      display: block;
      overflow: hidden;
      height: 1.15em;
      width: 0;
      margin-left: -10px;
      margin-top: 3px;
      position: relative;
      z-index: 1;
    }
    .brand-word {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      color: #7a91a3;
    }
    .brand.brand-animate .brand-logo {
      opacity: 0;
      transform: scale(0.92);
      animation: brandLogoIn 0.45s ease forwards;
    }
    .brand.brand-animate .brand-word-clip {
      animation: brandWordReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.38s forwards;
    }
    @keyframes brandLogoIn { to { opacity: 1; transform: scale(1); } }
    @keyframes brandWordReveal { to { width: 7.85em; } }
    @media (prefers-reduced-motion: reduce) {
      .brand.brand-animate .brand-logo,
      .brand.brand-animate .brand-word-clip {
        animation: none;
        opacity: 1;
        transform: none;
        width: 7.85em;
      }
    }
    .top-link {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
    }
    .top-link:hover { color: var(--text); border-color: rgba(69, 106, 237, 0.45); }
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 64px;
    }
    .card {
      width: min(420px, 100%);
      background: linear-gradient(160deg, rgba(69, 106, 237, 0.12), transparent 55%), var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 32px 32px;
    }
    .card h1 {
      margin: 0 0 10px;
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }
    .card p {
      margin: 0 0 28px;
      color: var(--mute);
      line-height: 1.55;
      font-size: 15px;
    }
    #google-btn {
      min-height: 44px;
      display: flex;
      justify-content: center;
    }
    #google-btn.busy { opacity: 0.45; pointer-events: none; }
    .signin-status {
      margin-top: 14px;
      color: var(--mint);
      font-size: 13px;
      font-weight: 600;
      display: none;
      text-align: center;
    }
    .signin-status.show { display: block; }
    .signin-error {
      margin-top: 14px;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }
    .signin-error.show { display: block; }
    .hint {
      margin-top: 22px;
      font-size: 13px;
      color: var(--mute);
      text-align: center;
    }
    .hint a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand brand-animate" href="/" aria-label="FrameBid">
      <img class="brand-logo" src="/assets/framebid-logo.png" alt="" width="87" height="40">
      <span class="brand-word-clip" aria-hidden="true"><span class="brand-word">FRAMEBID</span></span>
    </a>
    <a class="top-link" href="/">← Back</a>
  </header>

  <main class="main">
    <div class="card">
      <h1>Sign in</h1>
      <p>Use your Google account to open projects, run estimates, and save bid history.</p>
      <div id="google-btn"></div>
      <div id="signin-status" class="signin-status" aria-live="polite">Signing you in…</div>
      <div id="signin-error" class="signin-error" role="alert"></div>
      <div class="hint">New here? <a href="/">See how FrameBid works</a></div>
    </div>
  </main>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://127.0.0.1:8090'
  : 'https://vfx-estimator.onrender.com';

let GOOGLE_CLIENT_ID = '';

function loadSession() {
  try {
    const token = localStorage.getItem('vfx_auth_token');
    const user = JSON.parse(localStorage.getItem('vfx_user') || 'null');
    return token && user ? { token, user } : null;
  } catch {
    return null;
  }
}

function saveSession(user, token) {
  localStorage.setItem('vfx_auth_token', token);
  localStorage.setItem('vfx_user', JSON.stringify(user));
}

function showError(msg) {
  setBusy(false);
  const status = document.getElementById('signin-status');
  status.classList.remove('show');
  const el = document.getElementById('signin-error');
  el.textContent = msg || 'Sign-in failed';
  el.classList.add('show');
}

function setBusy(busy) {
  const btn = document.getElementById('google-btn');
  const status = document.getElementById('signin-status');
  const err = document.getElementById('signin-error');
  btn.classList.toggle('busy', busy);
  status.classList.toggle('show', busy);
  if (busy) err.classList.remove('show');
}

async function loadAuthConfig() {
  try {
    const r = await fetch(`${API}/auth/config`);
    const d = await r.json();
    GOOGLE_CLIENT_ID = d.google_client_id || '';
  } catch {
    GOOGLE_CLIENT_ID = '';
  }
}

function waitForGoogle() {
  return new Promise((resolve, reject) => {
    let n = 0;
    const t = setInterval(() => {
      if (window.google?.accounts?.id) {
        clearInterval(t);
        resolve();
      } else if (++n > 100) {
        clearInterval(t);
        reject(new Error('Google Identity script did not load. Check network / ad blockers.'));
      }
    }, 100);
  });
}

async function exchangeCredential(credential, attempt = 1) {
  const r = await fetch(`${API}/auth/google`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ credential }),
  });
  let data = {};
  try { data = await r.json(); } catch {
    if (attempt < 2) {
      await new Promise((res) => setTimeout(res, 600));
      return exchangeCredential(credential, attempt + 1);
    }
    throw new Error(r.ok ? 'Invalid server response' : 'Sign-in failed — API unreachable. Try again.');
  }
  if (!r.ok || !data.ok) {
    if (attempt < 2 && r.status >= 500) {
      await new Promise((res) => setTimeout(res, 600));
      return exchangeCredential(credential, attempt + 1);
    }
    const detail = data.detail;
    throw new Error(
      typeof detail === 'string' ? detail
        : Array.isArray(detail) ? detail.map(d => d.msg || d).join(', ')
        : 'Sign-in failed'
    );
  }
  return data;
}

async function handleGoogleCredential(response) {
  try {
    setBusy(true);
    if (!response?.credential) {
      throw new Error('Google did not return a credential. Try again, or check that this site is listed under Authorized JavaScript origins.');
    }
    const data = await exchangeCredential(response.credential);
    saveSession(data.user, response.credential);
    window.location.replace('/dashboard');
  } catch (e) {
    showError(e.message || 'Sign-in failed');
  }
}

async function initGoogleSignIn() {
  if (!GOOGLE_CLIENT_ID) {
    showError('GOOGLE_CLIENT_ID is not configured on the API. Set it on Render, then reload.');
    return;
  }
  try {
    await waitForGoogle();
    // Avoid FedCM + popup: that combo triggers COOP postMessage blocks in Chromium.
    // Default button flow posts the JWT credential via callback without opener messaging.
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
      auto_select: false,
      cancel_on_tap_outside: true,
      itp_support: true,
      use_fedcm_for_prompt: false,
    });
    const el = document.getElementById('google-btn');
    el.innerHTML = '';
    google.accounts.id.renderButton(el, {
      theme: 'filled_black',
      size: 'large',
      text: 'signin_with',
      shape: 'pill',
      width: 320,
    });
  } catch (e) {
    showError(e.message || 'Could not start Google Sign-In');
  }
}

(async () => {
  if (loadSession()) {
    window.location.replace('/dashboard');
    return;
  }
  await loadAuthConfig();
  await initGoogleSignIn();
})();
</script>
</body>
</html>
